name: cmake-build
description: "Configure and build a CMake project with Ninja and sccache (preset or manual mode)"

inputs:
  PRESET:
    required: false
    description: "CMake preset name. If set, uses preset mode (cmake --preset). Otherwise manual mode."
  BUILD_TYPE:
    required: false
    default: "RelWithDebInfo"
    description: "The build type (manual mode)"
  CMAKE_BUILD_PARALLEL_LEVEL:
    required: false
    default: "4"
    description: "The number of parallel builds"
  CMAKE_BUILD_ARGS:
    required: false
    description: "Additional cmake configure arguments (manual mode)"
  TARGETS:
    required: false
    description: "Space-separated list of targets to build (default: all)"
  KEEP_GOING:
    required: false
    default: "false"
    description: "Keep building after a failure (Ninja -k 0), so one run reports every compile error"

runs:
  using: "composite"
  steps:
    - name: cache the build
      uses: mozilla-actions/sccache-action@v0.0.8

    - name: print build configuration
      shell: bash
      run: |
        echo "PRESET=${{ inputs.PRESET }}"
        echo "BUILD_TYPE=${{ inputs.BUILD_TYPE }}"
        echo "CMAKE_BUILD_ARGS=${{ inputs.CMAKE_BUILD_ARGS }}"
        echo "TARGETS=${{ inputs.TARGETS }}"

    - name: cmake configure
      shell: bash
      run: |
        LAUNCHER="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        if [ -n "${{ inputs.PRESET }}" ]; then
          cmake --preset ${{ inputs.PRESET }} $LAUNCHER
        else
          ARCH=""
          if [[ "${{ matrix.name }}" == macOS-x86_64* ]]; then ARCH="-DCMAKE_OSX_ARCHITECTURES=x86_64"; fi
          if [[ "${{ matrix.name }}" == macOS-arm64* ]]; then ARCH="-DCMAKE_OSX_ARCHITECTURES=arm64"; fi
          # Windows: MSVC (cl) from the environment setup-build-tools prepared
          COMPILER=""
          if [[ "${{ matrix.name }}" == Windows* ]]; then COMPILER="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"; fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.BUILD_TYPE }} $LAUNCHER $ARCH $COMPILER ${{ inputs.CMAKE_BUILD_ARGS }}
        fi

    - name: build
      shell: bash
      run: |
        TARGET_ARGS=""
        for target in ${{ inputs.TARGETS }}; do TARGET_ARGS="$TARGET_ARGS --target $target"; done
        if [[ "${{ inputs.KEEP_GOING }}" == "true" ]]; then TARGET_ARGS="$TARGET_ARGS -- -k 0"; fi
        if [ -n "${{ inputs.PRESET }}" ]; then
          cmake --build --preset ${{ inputs.PRESET }} --parallel ${{ inputs.CMAKE_BUILD_PARALLEL_LEVEL }} $TARGET_ARGS
        else
          cmake --build build --config ${{ inputs.BUILD_TYPE }} --parallel ${{ inputs.CMAKE_BUILD_PARALLEL_LEVEL }} $TARGET_ARGS
        fi
